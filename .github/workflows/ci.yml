name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch speech runtime (checksum-verified)
        run: scripts/fetch-sherpa.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Release build (debug-signed, no keystore in CI)
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: openherdr-ci-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
